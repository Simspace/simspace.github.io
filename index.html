<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimSpace Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #e4002b;
      --dark:   #0a0b0e;
      --mid:    #12141a;
      --border: rgba(255,255,255,0.03);
      --text:   #c8ccd6;
      --white:  #ffffff;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    /* — grid lines background — */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* — red glow blob — */
    body::after {
      content: '';
      position: fixed;
      top: -10%;
      left: 50%;
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(228,0,43,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: driftGlow 5s ease-in-out infinite;
    }

    /* — blue glow blob (bottom) — */
    .glow-blue {
      position: fixed;
      bottom: -10%;
      left: 50%;
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0,100,228,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: driftBlue 5s ease-in-out infinite;
    }

    @keyframes driftBlue {
      0%   { transform: translateX(-50%) translateY(0)    scale(1); }
      25%  { transform: translateX(-62%) translateY(-6%)  scale(1.1); }
      50%  { transform: translateX(-45%) translateY(-12%) scale(0.95); }
      75%  { transform: translateX(-38%) translateY(-4%)  scale(1.08); }
      100% { transform: translateX(-50%) translateY(0)    scale(1); }
    }

    @keyframes driftGlow {
      0%   { transform: translateX(-50%) translateY(0)    scale(1); }
      25%  { transform: translateX(-38%) translateY(6%)   scale(1.1); }
      50%  { transform: translateX(-55%) translateY(12%)  scale(0.95); }
      75%  { transform: translateX(-62%) translateY(4%)   scale(1.08); }
      100% { transform: translateX(-50%) translateY(0)    scale(1); }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 0;
    }

    /* — top accent bar — */
    .accent-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--red) 40%, var(--red) 60%, transparent 100%);
    }

    /* — card — */
    .card {
      background: var(--mid);
      border: 1px solid var(--border);
      border-top: 1px solid rgba(228,0,43,0.3);
      max-width: 560px;
      width: 100%;
      padding: 3rem 3rem 2.75rem;
      text-align: center;
      position: relative;
      animation: fadeUp 0.7s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(228,0,43,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* — logo — */
    .logo-wrap {
      margin-bottom: 2rem;
    }

    .logo-wrap img {
      height: 44px;
      width: auto;
    }

    /* — divider — */
    .divider {
      width: 40px;
      height: 2px;
      background: var(--red);
      margin: 0 auto 1.75rem;
    }

    /* — heading — */
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    h1 span {
      color: var(--red);
    }

    /* — body copy — */
    .message {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text);
      max-width: 400px;
      margin: 0 auto 2.25rem;
    }

    /* — contact badge — */
    .contact-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(228,0,43,0.08);
      border: 1px solid rgba(228,0,43,0.25);
      padding: 0.65rem 1.25rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    .contact-badge svg {
      flex-shrink: 0;
    }

    /* — footer — */
    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      animation: fadeUp 0.9s 0.2s ease both;
    }
  </style>
</head>
